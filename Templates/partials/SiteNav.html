<header class="site-header">
    <div class="site-header-inner ck-container">
        <a class="site-logo" id="site-logo-trigger" href="{{ url_for('index') }}">{{ site_brand }}<span class="site-logo-dot">.</span></a>
        <div class="site-quick-links" aria-label="Quick links">
            <a class="site-quick-icon site-quick-home" href="{{ url_for('index') }}" aria-label="Home">
                <span aria-hidden="true">
                    <svg viewBox="0 0 24 24" role="img" focusable="false">
                        <path d="M12 3.2 3.7 10v10.3a.9.9 0 0 0 .9.9h5.4a.9.9 0 0 0 .9-.9v-5.4h2.2v5.4a.9.9 0 0 0 .9.9h5.4a.9.9 0 0 0 .9-.9V10L12 3.2z"></path>
                    </svg>
                </span>
            </a>
            <a class="site-quick-icon site-quick-about" href="{{ url_for('aboutpage') }}" aria-label="About">
                <span aria-hidden="true">
                    <svg viewBox="0 0 24 24" role="img" focusable="false">
                        <path d="M12 2.8a9.2 9.2 0 1 0 0 18.4 9.2 9.2 0 0 0 0-18.4zm0 4.1a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6zm1.5 10.2h-3V15h.7v-3h-.7v-2h2.3v5h.7v2.1z"></path>
                    </svg>
                </span>
            </a>
        </div>
        <button type="button" class="site-nav-toggle" id="site-nav-toggle" aria-expanded="false" aria-controls="site-nav-panel" aria-label="Open main menu">
            <span class="site-nav-toggle-bar" aria-hidden="true"></span>
            <span class="site-nav-toggle-bar" aria-hidden="true"></span>
            <span class="site-nav-toggle-bar" aria-hidden="true"></span>
        </button>
        <nav class="site-nav" id="site-nav-panel" aria-label="Main navigation" role="navigation">
            <a href="{{ url_for('index') }}" class="nav-link-home {% if request.path == url_for('index') %}is-active{% endif %}">Home</a>
            <a href="{{ url_for('transportations') }}" class="{% if request.path == url_for('transportations') %}is-active{% endif %}">Fleet</a>
            <a href="{{ url_for('aboutpage') }}" class="nav-link-about {% if request.path == url_for('aboutpage') %}is-active{% endif %}">About</a>
            {% if session.get('username') %}
                {% if nav_staff %}
                <a href="{{ url_for('damage_reports') }}" class="{% if request.path == url_for('damage_reports') %}is-active{% endif %}">Damage</a>
                {% endif %}
                <a href="{{ url_for('dashboard') }}" class="{% if request.path == url_for('dashboard') %}is-active{% endif %}">Dashboard</a>
                <a href="{{ url_for('logout') }}">Logout</a>
            {% else %}
                <a href="{{ url_for('loginpage') }}" class="{% if request.path == url_for('loginpage') %}is-active{% endif %}">Login</a>
                <a class="nav-cta" href="{{ url_for('registerpage') }}">Register</a>
            {% endif %}
        </nav>
    </div>
</header>
